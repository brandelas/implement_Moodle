# =============================================================================
# Terraform Plan
#
# Gatilhos (atende às duas fontes de requisitos):
#   - pull_request para main: exigido pelo enunciado da prova; o plano é
#     publicado como comentário na PR.
#   - workflow_dispatch: exigido pela rubrica do template (execução manual).
#
# O workflow FALHA (exit != 0) se init, validate ou plan retornarem erro.
# Ele nunca executa apply.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
#       → credenciais temporárias do Learner Lab (expiram em ~4 h; atualize
#         antes de cada execução, em "AWS Details" no portal AWS Academy).
#   TF_SSH_ALLOWED_CIDR, TF_EC2_PUBLIC_KEY, TF_DB_USERNAME, TF_DB_PASSWORD,
#   TF_MOODLE_ADMIN_PASSWORD
#       → variáveis obrigatórias do Terraform (sem valor padrão).
#
# Observação: o backend é local, então o plan no CI parte de um state vazio e
# sempre mostra a criação completa da infraestrutura.
# =============================================================================

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: "Diretório raiz do Terraform"
        required: false
        default: "terraform"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.event.inputs.terraform_dir || 'terraform' }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_SSH_ALLOWED_CIDR }}
      TF_VAR_ec2_public_key: ${{ secrets.TF_EC2_PUBLIC_KEY }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
      TF_VAR_moodle_admin_password: ${{ secrets.TF_MOODLE_ADMIN_PASSWORD }}

    steps:
      # Step 1 — Checkout do código
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Step 2 — Credenciais temporárias do Learner Lab (session token obrigatório)
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Step 3 — Terraform CLI (wrapper desligado para capturar o exit code real)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      # Step 4 — Init no diretório raiz do Terraform
      - name: Terraform Init
        run: terraform init -no-color

      # Step 5 — Validate
      - name: Terraform Validate
        run: terraform validate -no-color

      # Step 6 — Plan; a saída é salva para o comentário mesmo em caso de erro
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Resumo do plano no job
        if: always()
        run: |
          {
            echo "## Terraform Plan — ${{ steps.plan.outcome }}"
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo "plan.txt não gerado"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 7 — Publicar o plano como comentário na PR
      - name: Comentar o plano na PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_DIR: ${{ github.event.inputs.terraform_dir || 'terraform' }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.PLAN_DIR}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'plan.txt não gerado';
            const max = 60000;
            if (plan.length > max) {
              plan = '... (saída truncada; veja o log completo do job)\n' + plan.slice(-max);
            }
            const icon = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';
            const body = [
              `### ${icon} Terraform Plan — \`${process.env.PLAN_OUTCOME}\``,
              '',
              `Workflow: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '<details><summary>Mostrar plano</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Garante exit code != 0 quando o plan falha
      - name: Falhar se o plan retornou erro
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan falhou — veja o log acima."
          exit 1
